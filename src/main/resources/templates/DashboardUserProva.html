<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/processing.js}"></script>
    <title>Gym in Tech</title>
</head>
<body>
<header>
    <table>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a><!--logo--></td></tr>
    </table>

    <nav class="barra">
        <a th:href="@{/contattaci}"><button type="button" class="contattaci">Contattaci</button></a>
        <a th:href="@{/logout}"><button type="button" class="logout">Logout</button></a>
    </nav>
</header>

<main>
    <h1>Benvenuta <span th:text="${name}"></span>!</h1>
    <p>Allenamenti gratuiti usufruiti: <span th:text="${allenamentiUsufruiti}">/3</span></p>

<div class="layout">
    <div class="gestione">
        <a th:href="@{/profilo}"><button type="button" class="profilo">Profilo</button></a>
        <a th:href="@{/modificaPassword}"><button type="button" class="cambioPassword">Cambio password</button></a>
        <p id="successMsg" th:if="${param.passwordChanged}" style="color: green;">
            Password cambiata con successo!
        </p>

        <script>
            var msg = document.getElementById("successMsg");
            if (msg) {
                setTimeout(function() {
                    msg.style.display = "none";
                }, 30000); //30 secondi
            }
        </script>

        <!-- Bottone Update -->
        <button type="button" onclick="upgrade()">
            Upgrade
        </button>

        <!-- Form upgrade nascosto inizialmente -->
        <div id="upgradeForm" style="display: none;" class="mt-4">
            <form th:action="@{/upgradePlan}" method="post">

                <div class="row row-cols-1 row-cols-md-2 g-3 mb-4">

                    <!-- BASIC -->
                    <div class="col">
                        <label class="piano-card-label d-block">
                            <input type="radio" name="piano" value="Basic" required>
                            <div class="card text-center">
                                <div class="card-header bg-primary text-white fw-semibold">Basic</div>
                                <div class="card-body d-flex flex-column">
                                    <p class="card-text text-muted flex-grow-1">
                                        Accesso illimitato a tutti i piani di allenamento proposti dai nostri migliori personal trainers!
                                    </p>
                                    <ul class="list-group list-group-flush mt-2">
                                        <li class="list-group-item">Mensile: <strong>€19,99</strong></li>
                                        <li class="list-group-item">Annuale: <strong>€199,99</strong></li>
                                    </ul>
                                    <span class="badge bg-primary mt-3">Più popolare</span>
                                </div>
                            </div>
                        </label>
                    </div>

                    <!-- PRO -->
                    <div class="col">
                        <label class="piano-card-label d-block">
                            <input type="radio" name="piano" value="Pro" required>
                            <div class="card text-center">
                                <div class="card-header bg-warning text-dark fw-semibold">Pro</div>
                                <div class="card-body d-flex flex-column">
                                    <p class="card-text text-muted flex-grow-1">
                                        Accesso illimitato a tutti i piani di allenamento, con possibilità di creare nuovi allenamenti personalizzati!
                                    </p>
                                    <ul class="list-group list-group-flush mt-2">
                                        <li class="list-group-item">Mensile: <strong>€39,99</strong></li>
                                        <li class="list-group-item">Annuale: <strong>€399,99</strong></li>
                                    </ul>
                                    <span class="badge bg-warning text-dark mt-3">Premium</span>
                                </div>
                            </div>
                        </label>
                    </div>

                </div>

                <button type="submit" style="background-color: #3e6f8e; color:white;">Conferma Upgrade</button>
            </form>
        </div>
    </div>

    <div class="scheda">
        <a th:href="@{/allenamenti}"><button type="button" class="allenamento">Allenamento</button></a>
    </div>
</div><br><br>
    
<div class="recensione">
    <h2>Recensioni</h2>
    
    <div>
        <div class="">
            <textarea id="testo" placeholder="Scrivi la tua recensione"></textarea>
        </div>

        <button onclick="inviaRecensione()">
            Inserisci recensione
        </button>

    </div>

    <div id="carouselRecensioni" class="carousel slide" data-bs-ride="carousel" data-bs-interval="30000">

        <div class="carousel-inner" id="carouselInner"></div>

    </div>


</div>
    

</main>

<footer>
    <table>
        <tr>
            <td class="informazione" >  <b>Dove trovarci:</b> Via Sommarive 9, 38123, Povo (TN) </td>
            <td class="informazione" > <b>Email:</b>  gym.in.tech@git.com</td>
            <td class="informazione" > <b>P.IVA:</b> 02583980338</td>
        </tr>
    </table>
</footer>

<script>
    function upgrade() {
        var form = document.getElementById("upgradeForm");
        form.style.display = form.style.display === "none" ? "block" : "none";
    }
</script>

</body>
</html>
