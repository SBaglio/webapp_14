<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym in Tech</title>
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
    <style>
        .contenitore-centrato {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 100px auto 80px auto;
            font-family: Arial, sans-serif;
        }
        .contenitore-centrato h1 {
            color: #3e6f8e;
            margin-bottom: 20px;
        }
        .tabella-utenti {
            width: 75%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            border: 1px solid #dddddd;
        }
        .tabella-utenti th, .tabella-utenti td {
            padding: 12px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .tabella-utenti thead tr {
            background-color: #f4f1ea;
            color: #3e6f8e;
        }
    </style>
</head>

<body>
<header>
    <table>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a></td></tr>
    </table>

    <nav class="barra">
        <a th:href="@{/logout}"><button type="button" class="logout">Logout</button></a>
    </nav>
</header>

<main class="contenitore-centrato">
    <h1>Lista Utenti</h1>
    <table class="tabella-utenti">
        <thead>
            <tr>
                <th>Username</th>
                <th>Ruolo</th>
                <th>Data di Registrazione</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="user : ${utenti}">
                <td th:text="${user.getUsername()}"> </td>
                <td th:text="${user.getRole()}"> </td>
                <td th:text="${user.getSignupDate()}"> </td>
            </tr>
        </tbody>
    </table>

    <p></p>

    <a th:href="@{/dashboard}">
        <button type="button" class="torna">Torna alla dashboard</button>
    </a>
</main>

<footer>
    <table>
        <tr>
            <td class="informazione" >  <b>Dove trovarci:</b> Via Sommarive 9, 38123, Povo (TN) </td>
            <td class="informazione" > <b>Email:</b>  gym.in.tech@git.com</td>
            <td class="informazione" > <b>P.IVA:</b> 02583980338</td>
        </tr>
    </table>
</footer>

</body>
</html>
