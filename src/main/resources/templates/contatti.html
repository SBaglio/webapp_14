<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Gym in Tech</title>
    <link rel="icon" type="image/png" href="logo.png">

</head>
<body>
<header>
    <table>
        <td><a href="index.html"><img src="logo.png" id="logo"> </a><!--logo--></td>
    </table>
</header>
<main>
    <h1>Contattaci!</h1>
    <form th:action="@{/addUser}" method = post>
        <label for="firstName">Nome</label><br>
        <input type="text" id="firstName" name="firstName" value="" required><br><br>

        <label for="email">E-mail</label><br>
        <input type="text" id="email" name="email" value="" required><br><br>
        <label for="message">Messaggio</label><br>
        <input type="text" id="message" name="message" value="" required><br><br>

        <input type="submit" class="invio" value="Invia">
    </form>
</main>

</body>
</html>
