<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gym in Tech</title>
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
    <style>
        textarea{
            width: 40%;
            height: 150px;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #f4f1ea;
            font-size: large;
        }
    </style>
</head>
<body>
<header>
    <table>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"></a><!--logo--></td></tr>
    </table>
</header>
<main>
    <h1>Contattaci!</h1>
    <p id="successMsg" th:if="${param.invioSuccesso}" style="color: green;">
        Messaggio inviato con successo!
    </p>
    <form th:action="@{/contattaci}" method = post>
        <label for="firstName">Nome</label><br>
        <input type="text" id="firstName" name="firstName" value="" required><br><br>

        <label for="email">E-mail</label><br>
        <input type="text" id="email" name="email" value="" required><br><br>

        <label for="messaggio">Messaggio</label><br>
        <textarea id="messaggio" name="messaggio" required></textarea><br><br>

        <input type="submit" class="invio" value="Invia">

    </form>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const msg = document.getElementById("successMsg");
        if (msg) {
            setTimeout(function() {
                msg.style.display = "none";
            }, 10000); //10 secondi
        }
    });
</script>
</body>
</html>
