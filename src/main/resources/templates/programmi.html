<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym in Tech</title>
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header>
    <table>
        <tr>
            <td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo" alt="Logo"></a></td>
        </tr>
    </table>

    <nav class="barra">
        <a th:href="@{/logout}"><button type="button" class="logout">Logout</button></a>
        <a th:href="@{/contatti}"><button type="button" class="contattaci">Contattaci</button></a>
    </nav>
</header>

<main style="display: block; clear: both; padding-top: 30px;">
    <div class="container py-4">
        <div class="row">
            <div class="col-12 col-md-10 col-lg-8 mx-auto">

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-sm-5">

                        <h1 class="h2 text-center text-dark mb-4 fw-bold">Nuovo Programma Personalizzato</h1>

                        <div th:if="${messaggioSuccesso != null}" class="alert alert-success border-0 shadow-sm mb-4" role="alert">
                            <div class="mb-2">
                                <span class="fs-4 me-1">✓</span>
                                <strong th:text="${messaggioSuccesso}">Inserimento andato a buon fine!</strong>
                            </div>
                            <hr class="my-2">
                            <p class="mb-0 text-secondary">
                                Kcal associate complessive (da Servizio REST):
                                <span th:text="${kcalCalcolate}" class="badge bg-success fs-6 ms-1">0</span> kcal
                            </p>
                        </div>

                        <form th:action="@{/allenamento/salva}" method="post">

                            <div class="mb-4 p-3 bg-light rounded border">
                                <label for="nomeProgramma" class="form-label fw-bold text-dark fs-5">Nome del Programma Generale</label>
                                <input type="text" id="nomeProgramma" name="nomeProgramma" class="form-control form-control-lg" required placeholder="Es: Scheda Massa Invernale">
                            </div>

                            <h4 class="text-secondary mb-3 fw-bold">Esercizi del Programma</h4>

                            <div id="eserciziContainer">

                                <div class="esercizio-row row g-3 mb-3 p-3 border rounded bg-white">
                                    <div class="col-12">
                                        <label class="form-label fw-semibold text-secondary">Nome dell'Esercizio</label>
                                        <input type="text" name="esercizi[0].nomeEs" class="form-control" required placeholder="Es: Squat, Panca Piana...">
                                    </div>

                                    <div class="col-6">
                                        <label class="form-label fw-semibold text-secondary">Numero di Serie</label>
                                        <input type="number" name="esercizi[0].numSerie" class="form-control" min="1" required placeholder="Es: 4">
                                    </div>

                                    <div class="col-6">
                                        <label class="form-label fw-semibold text-secondary">Ripetizioni</label>
                                        <input type="number" name="esercizi[0].numRipetizioni" class="form-control" min="1" required placeholder="Es: 10">
                                    </div>
                                </div>

                            </div>

                            <div class="mb-4">
                                <button type="button" class="btn btn-outline-primary btn-sm fw-bold" onclick="aggiungiEsercizio()">
                                    + Aggiungi un altro esercizio
                                </button>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">Salva Intero Programma</button>
                        </form>

                        <div class="text-center mt-4">
                            <a th:href="@{/allenamenti}" class="text-decoration-none text-muted small">
                                ← Torna alla lista programmi
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<footer>
    <table>
        <tr>
            <td class="informazione"><b>Dove trovarci:</b> Via Sommarive 9, 38123, Povo (TN)</td>
            <td class="informazione"><b>Email:</b> gym.in.tech@git.com</td>
            <td class="informazione"><b>P.IVA:</b> 02583980338</td>
        </tr>
    </table>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let esercizioIndex = 1; // Il primo a indice 0 esiste già, partiamo da 1

    function aggiungiEsercizio() {
        const container = document.getElementById('eserciziContainer');

        // Crea un nuovo blocco esercizio identico al primo ma con l'indice aggiornato
        const newRow = document.createElement('div');
        newRow.className = 'esercizio-row row g-3 mb-3 p-3 border rounded bg-white';

        newRow.innerHTML = `
            <div class="col-12">
                <label class="form-label fw-semibold text-secondary">Nome dell'Esercizio</label>
                <input type="text" name="esercizi[${esercizioIndex}].nomeEs" class="form-control" required placeholder="Es: Prossimo Esercizio...">
            </div>

            <div class="col-6">
                <label class="form-label fw-semibold text-secondary">Numero di Serie</label>
                <input type="number" name="esercizi[${esercizioIndex}].numSerie" class="form-control" min="1" required placeholder="Es: 4">
            </div>

            <div class="col-6">
                <label class="form-label fw-semibold text-secondary">Ripetizioni</label>
                <input type="number" name="esercizi[${esercizioIndex}].numRipetizioni" class="form-control" min="1" required placeholder="Es: 10">
            </div>
        `;

        container.appendChild(newRow);
        esercizioIndex++; // Incrementa l'indice per il prossimo esercizio (2, 3, 4...)
    }
</script>
</body>
</html>
