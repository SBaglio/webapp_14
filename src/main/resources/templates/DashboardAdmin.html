<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
    <title>Gym in Tech</title>
</head>
<body>
<header>
    <table>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a><!--logo--></td></tr>
    </table>

    <nav class="barra">
        <a th:href="@{/contattaci}"><button type="button" class="contattaci">Contattaci</button></a>
        <a th:href="@{/logout}"><button type="button" class="logout">Logout</button></a>
    </nav>
</header>

<main>
    <h1 style="color: #3e6f8e" class="mb-4">Benvenuta <span th:text="${name}"></span>!</h1>
    <br>
    <div class="funzioni">
        <table>
            <tr>
                <td><a th:href="@{/listaUtenti}"><button type="button" class="listaUtenti">Visualizza Lista Utenti</button></a></td>
                <td><button type="button" class="utentiScaduti" onclick="confermaRimozione()">Rimuovi utenti scaduti</button>
                    <p id="successMsg" style="color: green; display: none;">Utenti rimossi: <span id="numeroRimossi"></span></p>
                </td>
                <td><a th:href="@{/statisticheAdmin}"><button type="button" class="statistiche">Statistiche</button></a></td>
            </tr>
        </table>
    </div>
    <br>
</main>

<footer>
    <table>
        <tr>
            <td class="informazione" >  <b>Dove trovarci:</b> Via Sommarive 9, 38123, Povo (TN) </td>
            <td class="informazione" > <b>Email:</b>  gym.in.tech@git.com</td>
            <td class="informazione" > <b>P.IVA:</b> 02583980338</td>
        </tr>
    </table>
</footer>

<script>
    function confermaRimozione() {
        if (confirm("Sei sicuro di voler eliminare definitivamente tutti gli utenti PROVA disabilitati?")) {
            fetch('/rimuoviProvaDisabilitati', {
                method: 'POST'
            })
                .then(response => {
                    if (!response.ok) throw new Error("Errore nel server");
                    return response.json();
                })
                .then(numeroRimossi => {
                    const msg = document.getElementById("successMsg");
                    document.getElementById("numeroRimossi").textContent = numeroRimossi;
                    msg.style.display = "block";

                    setTimeout(function() {
                        msg.style.display = "none";
                    }, 15000); //15 secondi
                })
                .catch(error => {
                    console.error("Errore:", error);
                    alert("Si è verificato un errore durante l'operazione.");
                });
        }
    }
</script>

</body>
</html>
