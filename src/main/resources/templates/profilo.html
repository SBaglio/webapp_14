<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gym in Tech</title>
	<link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <style>
        p{
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <table>
            <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a></td></tr>
        </table>

        <nav class="barra">
            <a th:href="@{/contattaci}"><button type="button" class="contattaci">Contattaci</button></a>
            <a th:href="@{/logout}"><button type="button" class="logout">Logout</button></a>
        </nav>
    </header>

    <main>
        <h1 style="color: #3e6f8e">Il tuo profilo</h1>

	    <p><strong>Nome:</strong> <span th:text="${nome}"></span></p>

	    <p><strong>Cognome:</strong> <span th:text="${cognome}"></span></p>

	    <p><strong>Data di nascita:</strong> <span th:text="${dataNascita}"></span></p>

	    <p><strong>Ruolo:</strong> <span th:text="${ruolo}"></span></p><br>

        <a th:href="@{/dashboard}">
            <button type="button" class="torna">Torna alla dashboard</button>
        </a>
    </main>

    <footer>
        <table>
            <tr>
                <td class="informazione" >  <b>Dove trovarci:</b> Via Sommarive 9, 38123, Povo (TN) </td>
                <td class="informazione" > <b>Email:</b>  gym.in.tech@git.com</td>
                <td class="informazione" > <b>P.IVA:</b> 02583980338</td>
            </tr>
        </table>
    </footer>


</body>
</html>
