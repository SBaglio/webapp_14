<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Gym in Tech</title>

</head>
<body>
<header>
    <table style="align-self: center";>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a><!--logo--></td></tr>
    </table>
</header>

<main>
<h1>Iscriviti!</h1>
    <div th:if="${errorMessage != null}"  style="width: 25%; text-align: center; margin: 0 auto;" class="alert alert-danger" >
        <span th:text="${errorMessage}"></span>
    </div>
<form th:action="@{/addUser}" method = post id="registrationForm">
    <label for="firstName">Nome</label><br>
    <input type="text" id="firstName" name="firstName" value="" required><br><br>

    <label for="lastName">Cognome</label><br>
    <input type="text" id="lastName" name="lastName" value="" required><br><br>

    <label for="birthDate">Data di nascita</label><br>
    <input type="text" id="birthDate" name="birthDate" placeholder="GG/MM/YYYY"
           pattern="(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}"
           title="Formato richiesto: GG/MM/YYYY" required>
    <br><br>

    <label for="email">E-mail</label><br>
    <input type="email" id="email" name="email" value="" required><br><br>

    <label for="username">Username</label><br>
    <input type="text" id="username" name="username" value="" required><br><br>

    <label for="password">Password</label><br>
    <input type="password" id="password" name="password"
           pattern="(?=.*id_14).{8,}"
           title="Deve contenere la stringa 'id_14' e almeno 8 o piu' caratteri" required>
    <br><br>

    <div id="message">
        <h3>La password deve contenere:</h3>
        <p id="letter" class="invalid">La seguente stringa: <b> id_14 </b></p>
        <p id="length" class="invalid">Minimo <b>8 caratteri</b></p>
    </div>

    <label for="confirmPassword">Conferma Password</label><br>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
    <br><br>

    <p id="confirm-msg"></p>


    <!-- ===== Selezione piano allenamento con Bootstrap cards ===== -->
    <fieldset style="border: none; padding: 0; margin-bottom: 1.5rem;">
        <legend>Seleziona il tuo piano di allenamento</legend>
        <br>

        <div class="piani-container">
            <div class="row row-cols-1 row-cols-md-3 g-3">

                <!-- PROVA -->
                <div class="col">
                    <label class="piano-card-label d-block">
                        <input type="radio" name="piano" value="Prova" required>
                        <div class="card text-center">
                            <div class="card-header bg-secondary text-white fw-semibold">
                                Prova
                            </div>
                            <div class="card-body d-flex flex-column">
                                <p class="card-text text-muted flex-grow-1">
                                    Vuoi provare la nostra palestra? Con il piano di prova avrai l'accesso base per 3 allenamenti gratuiti!
                                </p>
                                <ul class="list-group list-group-flush mt-2">
                                    <li class="list-group-item">Mensile: <strong>€0,00</strong></li>
                                    <li class="list-group-item">Annuale: <strong>€0,00</strong></li>
                                </ul>
                                <span class="badge bg-secondary mt-3">Gratuito</span>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- BASIC -->
                <div class="col">
                    <label class="piano-card-label d-block">
                        <input type="radio" name="piano" value="Basic" required>
                        <div class="card text-center">
                            <div class="card-header bg-primary text-white fw-semibold">
                                Basic
                            </div>
                            <div class="card-body d-flex flex-column">
                                <p class="card-text text-muted flex-grow-1">
                                    Accesso illimitato a tutti i piani di allenamento proposti dai nostri migliori personal trainers!
                                </p>
                                <ul class="list-group list-group-flush mt-2">
                                    <li class="list-group-item">Mensile: <strong>€19,99</strong></li>
                                    <li class="list-group-item">Annuale: <strong>€199,99</strong></li>
                                </ul>
                                <span class="badge bg-primary mt-3">Più popolare</span>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- PRO -->
                <div class="col">
                    <label class="piano-card-label d-block">
                        <input type="radio" name="piano" value="Pro" required>
                        <div class="card text-center">
                            <div class="card-header bg-warning text-dark fw-semibold">
                                Pro
                            </div>
                            <div class="card-body d-flex flex-column">
                                <p class="card-text text-muted flex-grow-1">
                                    Accesso illimitato a tutti i piani di allenamento, con possibilità di creare nuovi allenamenti personalizzati!
                                </p>
                                <ul class="list-group list-group-flush mt-2">
                                    <li class="list-group-item">Mensile: <strong>€39,99</strong></li>
                                    <li class="list-group-item">Annuale: <strong>€399,99</strong></li>
                                </ul>
                                <span class="badge bg-warning text-dark mt-3">Premium</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </fieldset>
    <!-- ===== Fine selezione piano ===== -->


    <div class="d-flex justify-content-center gap-5" >
        <input type="reset" class="invio" value="Reset" id="resetBtn">
        <input type="submit" class="invio" value="Registrati">
    </div>

</form>

</main>
<script>

    var passwordInput = document.getElementById("password");
    var confirmInput  = document.getElementById("confirmPassword");
    var letterMsg     = document.getElementById("letter");
    var lengthMsg     = document.getElementById("length");
    var confirmMsg    = document.getElementById("confirm-msg");
    var birthDateInput = document.getElementById("birthDate");

    passwordInput.onfocus = function () {
        document.getElementById("message").style.display = "block";
    };
    passwordInput.onblur = function () {
        document.getElementById("message").style.display = "none";
    };

    passwordInput.onkeyup = function () {
        if (passwordInput.value.includes("id_14")) {
            letterMsg.classList.replace("invalid", "valid");
        } else {
            letterMsg.classList.replace("valid", "invalid");
        }
        if (passwordInput.value.length >= 8) {
            lengthMsg.classList.replace("invalid", "valid");
        } else {
            lengthMsg.classList.replace("valid", "invalid");
        }
        checkConfirm();
    };

    // check conferma password == password
    confirmInput.onkeyup = checkConfirm;

    function checkConfirm() {
        if (confirmInput.value.length === 0) {
            confirmMsg.textContent = "";
            return;
        }
        if (passwordInput.value === confirmInput.value) {
            confirmMsg.textContent = "Le password coincidono";
            confirmMsg.style.color = "green";
        } else {
            confirmMsg.textContent = "Attenzione! Le password non coincidono";
            confirmMsg.style.color = "red";
        }
    }

    // Reset errore data appena l'utente modifica il campo
    birthDateInput.addEventListener("input", function () {
        birthDateInput.setCustomValidity("");
    });

    document.getElementById("registrationForm").addEventListener("submit", function (e) {
        // check password
        if (passwordInput.value !== confirmInput.value) {
            e.preventDefault();
            confirmMsg.textContent = "Attenzione! Le password non coincidono. Correggile prima di procedere.";
            confirmMsg.style.color = "red";
            confirmInput.focus();
            return;
        }

        // check data
        var parts = birthDateInput.value.split("/");
        var g = parseInt(parts[0]), m = parseInt(parts[1]), a = parseInt(parts[2]);
        var birthDate = new Date(a, m - 1, g);

        // il pattern non basta per controllare la validità della data
        // JS fa overflow se la data inserita non è valida (es. 30/02)
        // check sulla correttezza:
        if (
            birthDate.getFullYear() !== a ||
            birthDate.getMonth() !== m - 1 ||
            birthDate.getDate() !== g
        ) {
            e.preventDefault();
            document.getElementById("birthDate").setCustomValidity("La data inserita non esiste.");
            document.getElementById("birthDate").reportValidity();
            return;
        }

        // check maggiore età
        var oggi = new Date();
        var eta18 = new Date(birthDate);
        eta18.setFullYear(eta18.getFullYear() + 18);

        if (eta18 > oggi) {
            e.preventDefault();
            document.getElementById("birthDate").setCustomValidity("Devi avere almeno 18 anni per iscriverti.");
            document.getElementById("birthDate").reportValidity();
            return;
        }

        document.getElementById("birthDate").setCustomValidity("");

    });

    document.getElementById("resetBtn").addEventListener("click", function () {
        confirmMsg.textContent = "";
        letterMsg.classList.replace("valid", "invalid");
        lengthMsg.classList.replace("valid", "invalid");
        birthDateInput.setCustomValidity("");
    });
</script>
</body>
</html>
