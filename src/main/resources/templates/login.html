<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Gym in Tech</title>
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
</head>

<body>
<header>
    <table>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a><!--logo--></td></tr>
    </table>
</header>
<main>
    <p th:if="${param.error}" id="errorMsg" style="color:red; font-weight: bold; font-size: medium;">
        #14: That user is not authenticated!
    </p>
    <h1>Log In</h1>
    <div class="container">
        <form th:action="@{/login}" method="post">
            <div>
                <input type="text" name="username" placeholder="Username"/>
            </div>
            <div>
                <input type="password" id="password" name="password" placeholder="Password"  pattern="(?=.*id_14).{8}$"
                       title="Deve contenere la stringa 'id_14' e esattamente 8 caratteri" required>
            </div>
            <input type="submit" class="invio" value="Log in" />
        </form>
    </div>
</main>

<script>
    var msg = document.getElementById("errorMsg");
    if (msg) {
        setTimeout(function() {
            msg.style.display = "none";
        }, 15000); //15 secondi
    }
</script>

</body>
</html>
