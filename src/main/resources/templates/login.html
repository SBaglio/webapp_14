<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Gym in Tech</title>
    <link rel="icon" type="image/png"th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
</head>

<body>
<header>
    <table>
        <td><a th:href="@{/index}"><img th:src="@{images/logo.png}" id="logo"> </a><!--logo--></td>
    </table>
</header>
<main>
    <h1>Log In</h1>
    <div class="container">
        <form th:action="@{/dashboard}" method="post">
            <div>
                <input type="text" name="username" placeholder="Username"/>
            </div>
            <div>
                <input type="password" id="password" name="password" placeholder="Password" pattern="(?='id_14').{8,}"
                       title="Deve contenere la stringa 'id_14' e almeno 8 o piu' caratteri" required>
            </div>
            <input type="submit" class="invio" value="Log in" />
        </form>
    </div>
</main>

</body>
</html>
