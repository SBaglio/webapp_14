<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/logoBlu.png}">
    <link rel="stylesheet" type="text/css"  th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/processing.js}"></script>
    <title>Gym in Tech</title>
</head>
<body>
<header>
    <table>
        <tr><td><a th:href="@{/index}"><img th:src="@{/images/logo.png}" id="logo"> </a><!--logo--></td></tr>
    </table>

    <nav class="barra">
        <a th:href="@{/contattaci}"><button type="button" class="contattaci">Contattaci</button></a>
        <a th:href="@{/logout}"><button type="button" class="logout">Logout</button></a>
    </nav>
</header>

<main>
    <h1 style="color: #3e6f8e">Benvenuta <span th:text="${name}"></span>!</h1>

    <div class="layout">
        <div class="gestione">
            <a th:href="@{/profilo}"><button type="button" class="profilo">Profilo</button></a>
            <a th:href="@{/modificaPassword}"><button type="button" class="cambioPassword">Cambio password</button></a>

            <p id="successMsg" th:if="${param.passwordChanged}" style="color: green;">
                Password cambiata con successo!
            </p>

            <script>
                var msg = document.getElementById("successMsg");
                if (msg) {
                    setTimeout(function() {
                        msg.style.display = "none";
                    }, 30000); //30 secondi
                }
            </script>
        </div>

        <div class="scheda">
            <a th:href="@{/allenamentiPro}"><button type="button" class="allenamento">Allenamento</button></a>
            <a th:href="@{/statisticheUser}"><button type="button" class="statisticheUser">Statistiche</button></a>
            <a th:href="@{/programmi}"><button type="button" class="programmi">Inserisci nuovo Programma</button></a>
        </div>
    </div><br><br>

    <div class="recensione">
        <h2>Recensioni</h2>
        
        <div>
            <div class="">
                <textarea id="testo" placeholder="Scrivi la tua recensione"></textarea>
            </div>

            <button class="btn-recensione" onclick="inviaRecensione()">
                Inserisci recensione
            </button>

        </div>

        <div id="carouselRecensioni" class="carousel slide" data-bs-ride="carousel" data-bs-interval="30000">

            <div class="carousel-inner" id="carouselInner"></div>

        </div>

    </div>
</main>

<footer>
    <table>
        <tr>
            <td class="informazione" >  <b>Dove trovarci:</b> Via Sommarive 9, 38123, Povo (TN) </td>
            <td class="informazione" > <b>Email:</b>  gym.in.tech@git.com</td>
            <td class="informazione" > <b>P.IVA:</b> 02583980338</td>
        </tr>
    </table>
</footer>

</body>
</html>
